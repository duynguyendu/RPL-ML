[defaults]
deprecation_warnings = False
interpreter_python = auto_silent
host_key_checking = False
inventory = inventory.yml
# Same as ansible-core's built-in "default" stdout callback, but without the
# unconditional "FAILED - RETRYING" spam that simulate_seeds.yml's 24h
# async_status poll loop would otherwise print every 30s. See
# callback_plugins/quiet_retries.py.
callback_plugins = ./callback_plugins
stdout_callback = quiet_retries
# profile_tasks: prints how long each task took (and a slowest-tasks summary
# at the end). timer: prints the whole playbook's total wall-clock run time
# after PLAY RECAP -- since every other task (git pull, venv check, plotting,
# rsync) is seconds-scale, this is effectively "how long simulate.py took".
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
